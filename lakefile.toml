name = "hex-sparse-poly-mathlib"
defaultTargets = ["HexSparsePolyMathlib"]

leanOptions = [
  { name = "doc.verso", value = true },
  { name = "doc.verso.suggestions", value = false },
]

[[require]]
name = "HexSparsePoly"
git = "https://github.com/leanprover/hex-sparse-poly.git"
rev = "99a9f0e556d3"

[[require]]
name = "HexPolyMathlib"
git = "https://github.com/leanprover/hex-poly-mathlib.git"
rev = "bc2b5505b543d9f0e6ef641901dab6c1bd97bf21"

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "85e3a25e006c35636f0e53b0e9296caca2685bc0"

[[lean_lib]]
name = "HexSparsePolyMathlib"
globs = [
  "HexSparsePolyMathlib",
  "HexSparsePolyMathlib.Equiv",
]

[[lean_lib]]
name = "HexSparsePolyMathlibTests"
globs = ["HexSparsePolyMathlib.LintTests"]
